[Settings]
Verbose=off
HUDSortType=distance
HUDSortOrder=normal
SortType=priority
SortOrder=normal
DisplayHUDElements=on
HUDColor=FFEA08
GuildHUDColor=FF00FF
DeadHUDColor=888888
TargetHUDColor=FF0000
PopupColorAdd=lightgreen
PopupColorRem=red
ChatColorAdd=009933
ChatColorRem=CC0033
NumDisplayed=5
HUDFontSize=2
HUDXStart=165
HUDYStart=5
HUDYIncrement=12
UseConColor=on
HUDString=&clr${Target.CleanName} ${Target.Level} ${Target.Class.ShortName}  ${Target.Distance}&arr(${Target.HeadingTo})
NotifyHUDString=${Target.CleanName} (${Target.Level} ${Target.Class.ShortName})
NotifyChatString=${Target.CleanName} (${Target.Level} ${Target.Class.ShortName}) ${If[${Target.Guild.NotEqual["NULL"]},in ${Target.Guild},]}${If[${Target.Guild.NotEqual["NULL"]},${If[${Target.GuildStatus.NotEqual["member"]}, (${Target.GuildStatus}),]},]}
UseMQ2Chat=on
UpdateInBackground=on
MP3Length=3000
WavLength=0
UseTimeStamp=on
TimeStampFormat=[%H:%M:%S]
UseChatReport=on
UseAllZone=on
